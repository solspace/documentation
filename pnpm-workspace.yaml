overrides:
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  csstype: 3.2.3
  form-data: 4.0.6
  minimatch: 3.1.5
  axios: 1.20.0
  follow-redirects: 1.16.0
  lodash: 4.18.1
  lodash-es: 4.18.1
  serialize-javascript: 7.0.5
  webpackbar: 7.0.0
  # Also replace older nested copies retained by CSS optimizer dependencies.
  browserslist: 4.29.3
  colord: 2.10.0
  source-map-js: 1.2.2
  svgo: 3.3.5
  # Security fixes outside the ranges requested by Docusaurus and its loaders.
  sharp: 0.35.5
  tinypool: 2.2.0
  postcss-selector-parser: 7.1.6
  # SockJS uses the CommonJS v4 API; uuid 12+ is ESM-only.
  'sockjs>uuid': 11.1.1
engineStrict: true
nodeLinker: hoisted
publicHoistPattern:
  - '@docusaurus/*'
  - '@docsearch/*'
  - react
  - react-dom
allowBuilds:
  '@swc/core': true
  core-js: false
  sharp: true
