<svg xmlns="http://www.w3.org/2000/svg" id="art" viewBox="0 0 100 100" role="img" aria-label="darkMode">
  <style>
    #art:target .tile { display: none; }
    #art:target .crescent { fill: none; stroke: #fff; stroke-width: 1.5; stroke-linejoin: round; }
    #art:not(:target) .art-accent { display: none; }
    #sky-only:target ~ .crescent, #moon-only:target ~ .sky { display: none; }

    @media (prefers-reduced-motion: no-preference) {
      #twinkle:target ~ .sky .star {
        transform-box: fill-box;
        transform-origin: center;
        animation: star-twinkle 4.8s ease-in-out infinite;
      }
    }

    @keyframes star-twinkle {
      0%, 65%, 88%, 100% { transform: scale(1); fill: #e2e9ff; filter: none; }
      76% { transform: scale(1.45); fill: #fff; filter: drop-shadow(0 0 1.8px #ded8ff); }
    }
  </style>
  <defs>
    <linearGradient id="dark-mode-sky" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#214982"/>
      <stop offset=".52" stop-color="#252754"/>
      <stop offset="1" stop-color="#624087"/>
    </linearGradient>
    <clipPath id="dark-mode-orbit-clip">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <g id="sky-only"/>
  <g id="moon-only"/>
  <g id="twinkle"/>
  <g class="sky">
    <circle class="tile" cx="50" cy="50" r="50" fill="url(#dark-mode-sky)"/>
    <g class="tile" clip-path="url(#dark-mode-orbit-clip)">
      <ellipse cx="91" cy="27" rx="35" ry="11" transform="rotate(-35 91 27)"
        fill="none" stroke="#b9b0ef" stroke-width=".8" opacity=".32"/>
    </g>
    <path class="star" d="M75 18l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#e2e9ff"/>
    <g fill="#e2e9ff">
      <circle cx="27" cy="22" r="1" opacity=".75"/>
      <circle cx="84" cy="55" r="1.05" opacity=".65"/>
      <circle cx="69" cy="80" r=".9" opacity=".7"/>
    </g>
  </g>
  <path class="crescent" d="M76.478 56.381A28 28 0 1 1 39.768 24.566A25 25 0 0 0 76.478 56.381Z" fill="#fff"/>
  <g class="art-accent" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".5">
    <path d="M12 49c1-10 4-17 10-22" stroke-dasharray="1 3.5"/>
    <path d="M15 57v9m-4.5-4.5h9M23 69v5m-2.5-2.5h5M52 14v6m-3-3h6"/>
  </g>
</svg>
