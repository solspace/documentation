<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" fill="none" stroke-linecap="round">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      path {
        animation: line-drift calc(var(--period) * .8) ease-in-out var(--delay) infinite alternate;
      }
    }

    @keyframes line-drift {
      from { transform: translate(calc(var(--x) * -.55), calc(var(--y) * -.55)); }
      50% { transform: translate(calc(var(--y) * .35), calc(var(--x) * -.25)); }
      to { transform: translate(var(--x), var(--y)); }
    }
  </style>
  <defs>
    <linearGradient id="tide" x1="20" y1="400" x2="1550" y2="115" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b8ed7" stop-opacity=".10"/>
