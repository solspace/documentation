      <stop offset=".76" stop-color="#7eb8db" stop-opacity=".55"/>
      <stop offset="1" stop-color="#77d7cb" stop-opacity=".39"/>
    </linearGradient>
    <linearGradient id="current" x1="340" y1="680" x2="1470" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#607ac1" stop-opacity="0"/>
      <stop offset=".58" stop-color="#78a2e4" stop-opacity=".25"/>
      <stop offset="1" stop-color="#76d3ca" stop-opacity=".58"/>
    </linearGradient>
  </defs>
